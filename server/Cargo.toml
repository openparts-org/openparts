[package]
name = "openparts-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "OpenParts distribution API server (Architecture Specification section 20)."

[dependencies]
openparts-core = { path = "../openparts/crates/openparts-core" }
openparts-data = { path = "../openparts/crates/openparts-data" }
openparts-validator = { path = "../openparts/crates/openparts-validator" }
openparts-solidcraft = { path = "../openparts/crates/mcad/openparts-solidcraft" }
openparts-artifacts = { path = "../openparts/crates/openparts-artifacts" }

axum = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

ts-rs = { version = "11", optional = true, features = ["no-serde-warnings"] }

[features]
# Exports the API response types as TypeScript (openparts-web).
ts = ["dep:ts-rs", "openparts-core/ts"]

[dev-dependencies]
openparts-stl = { path = "../openparts/crates/mcad/openparts-stl" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
