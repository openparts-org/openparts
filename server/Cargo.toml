[package]
name = "openparts-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "OpenParts distribution API server (Architecture Specification section 20)."

[dependencies]
openparts-core = { path = "../crates/openparts-core" }
openparts-data = { path = "../crates/openparts-data" }
openparts-validator = { path = "../crates/openparts-validator" }
openparts-mcad = { path = "../crates/mcad/openparts-mcad" }
openparts-solidcraft = { path = "../crates/mcad/openparts-solidcraft" }
openparts-artifacts = { path = "../crates/openparts-artifacts" }
openparts-bom = { path = "../crates/openparts-bom" }

axum = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

schemars = { version = "1", optional = true }

[features]
# MoonBit API types for openparts-web (from the JSON Schemas).
schema = ["dep:schemars", "openparts-core/schema", "openparts-bom/schema"]

[dev-dependencies]
openparts-stl = { path = "../crates/mcad/openparts-stl" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
