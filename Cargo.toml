[package]
name = "openparts"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "OpenParts workspace root crate; hosts tests/ integration tests."

[workspace]
resolver = "2"
members = [
    "crates/openparts-core",
    "crates/openparts-data",
    "crates/openparts-validator",
    "crates/openparts-client",
    "crates/openparts-cli",
    "crates/openparts-artifacts",
    "crates/openparts-bom",
    "crates/pcbcad/openparts-pcbcad",
    "crates/pcbcad/openparts-placement",
    "crates/pcbcad/openparts-kicad",
    "crates/pcbcad/openparts-librepcb",
    "crates/pcbcad/openparts-pcbcraft",
    "crates/mcad/openparts-mcad",
    "crates/mcad/openparts-step",
    "crates/mcad/openparts-stl",
    "crates/mcad/openparts-solidcraft",
    "crates/viewer/openparts-viewer",
    "server",
    "kicad-plugin",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
openparts-core = { path = "crates/openparts-core" }
openparts-data = { path = "crates/openparts-data" }
openparts-validator = { path = "crates/openparts-validator" }
openparts-mcad = { path = "crates/mcad/openparts-mcad" }
openparts-step = { path = "crates/mcad/openparts-step" }
openparts-stl = { path = "crates/mcad/openparts-stl" }
openparts-solidcraft = { path = "crates/mcad/openparts-solidcraft" }
openparts-pcbcad = { path = "crates/pcbcad/openparts-pcbcad" }
openparts-kicad = { path = "crates/pcbcad/openparts-kicad" }
openparts-placement = { path = "crates/pcbcad/openparts-placement" }

# The web site's part viewer (crates/viewer/openparts-viewer) compiled to
# wasm by web/scripts/build-wasm.sh, built for size: every part page
# downloads it. Only that script uses this profile; the other crates
# keep `release`. strip = "debuginfo", not true: wasm-bindgen reads the
# `target_features` section (it removes the name section itself).
# panic = "abort" is wasm32-unknown-unknown's own strategy anyway
# (console_error_panic_hook still reports the message).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"
