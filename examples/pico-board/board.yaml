# A Raspberry Pi Pico-style RP2040 board (51 x 21 mm, 2 x 20 pins at
# 2.54 mm on 17.78 mm row spacing) built from reference circuits: the
# RP2040 minimal design (Hardware design with RP2040: supply decoupling,
# core regulator, 12 MHz crystal, QSPI flash and BOOTSEL, USB series
# resistors, SWD/RUN, NCP1117 3.3 V LDO from VBUS, 10 uF bulk on 3V3)
# and the USB Type-C sink (Rd on CC1/CC2). The circuits' parts are
# chosen from the registry's catalog (board.lock.yaml pins them; the
# basis of every choice is in <dir>/basis.md); the rest is written here.
#
#   cp examples/pico-board/placement.yaml <dir>/
#   tools/kicad-board/build.py examples/pico-board/board.yaml --out <dir>
name: pico
registry: http://127.0.0.1:8080/api

board:
  width: 51.0
  height: 21.0
  layers: 2
  # The fab's published limits and the design values used (track,
  # clearance, via): tools/kicad-board/fab/<preset>.yaml, with its source.
  # Every routing width follows from it, the nets' currents (IPC-2221)
  # and the parts' Placement Models (escape widths, diff pairs).
  fab: {preset: jlcpcb-2layer-standard}
  # Currents the design budgets per supply net (A). VBUS: 1 A from the
  # USB-C receptacle; 3V3: the RP2040 and flash plus 300 mA for the
  # header's 3V3 pin; 1V1: the RP2040's core supply. GND returns them
  # through the pours (no current declared: pour nets are not tracks).
  # `voltage` (V) is each net's working voltage, for the capacitor
  # voltage-rating rule below.
  nets:
    VBUS: {current: 1.0, voltage: 5.0}
    3V3: {current: 0.3, voltage: 3.3}
    1V1: {current: 0.1, voltage: 1.1}
  # Copper pours on both outer layers.
  zones: [GND]
  # With --layers 4: JLCPCB's JLC04161H-7628 stackup, L1 signal, L2 a
  # ground plane (the USB pair's microstrip reference, 0.2104 mm below),
  # L3 a 3V3 plane, L4 signal. Planes are zones over the whole layer that
  # the router leaves alone; every 3V3 and GND pad reaches its plane by a
  # via (9 of 24 router configurations complete). `signal` for L3 gives a
  # third routing layer instead (3V3 tracks there at the inner IPC-2221
  # width; VBUS, too wide inside, stays out), but none of the 24
  # configurations completes with it.
  by_layers:
    4:
      fab: {preset: jlcpcb-4layer-standard}
      stackup: [signal, {plane: GND}, {plane: 3V3}, signal]

# How the circuits' parts are chosen (board policy, not a source's):
# 0603 chip capacitors and resistors, Samsung/Yageo first on a tie, and
# OpenParts' own rule that a capacitor is rated at least 1.5 x the
# working voltage of its nets.
select:
  filter:
    capacitor: {size: "0603"}
    resistor: {size: "0603"}
  prefer: {manufacturers: [samsung, yageo]}
  rules: {capacitor_voltage_margin: 1.5}

components:
  U1: raspberrypi/RP2040
  J1: gct/USB4105-GF-A
  J2: wurth/61302011121           # 1 x 20, 2.54 mm
  J3: wurth/61302011121
  J4: wurth/61300311121           # SWD: 1 x 3, SWCLK GND SWD as Pico's debug header
  D1: kingbright/APT1608SGC       # LED on GPIO25 (ours)
  R7: yageo/RC0603FR-07330RL      # its 330 ohm resistor (ours)

use:
  - circuit: raspberrypi/rp2040-minimal
    host: U1
    with: {3V3: 3V3, 1V1: 1V1, GND: GND, VBUS: VBUS, USB_DP: USB_CONN_D+, USB_DM: USB_CONN_D-,
           RUN: RUN, SWCLK: SWCLK, SWD: SWD}
    # Reference designators as before the circuits (placement.yaml).
    refs:
      C_IOVDD: [C1, C2, C3, C4, C5, C6]     # pins 1, 10, 22, 33, 42, 49
      C_ADC_AVDD: C7
      C_USB_VDD: C8
      C_FLASH: C9
      C_DVDD: [C10, C11]                    # pins 23, 50
      C_VREG_VIN: C12
      C_VREG_VOUT: C13
      C_IN: C14
      C_OUT: C15
      C_XIN: C16
      C_XOUT: C17
      C_BULK_3V3: C18
      U_FLASH: U2
      U_LDO: U3
      X1: Y1
      R_XOUT: R3
      R_BOOT: R4
      R_DP: R1
      R_DM: R2
      SW_BOOT: SW1
    override:
      # A tact switch (as on Pico) instead of the minimal design's jumper.
      SW_BOOT: {part: omron/B3FS-1050, pins: {"1": BOOT, "2": BOOT, "3": GND, "4": GND}}
      # 10 uF as the minimal design's C4 (NCP1117 asks for >= 4.7 uF).
      C_OUT: {part: samsung/CL10A106KP8NNNC}
    omit: [R_CS_PULLUP]                     # optional (DNF in the source)
    nets_as: {USB_DP: USB_D+, USB_DM: USB_D-, QSPI_CSn: QSPI_CS, BOOT: BOOTSEL}
  - circuit: usb-if/typec-usb2-sink
    host: J1
    with: {GND: GND, VBUS: VBUS, USB_DP: USB_CONN_D+, USB_DM: USB_CONN_D-}
    refs: {R_CC1: R5, R_CC2: R6}

# What no circuit says: header pins, the LED, ground on the headers.
nets:
  GND: [J2.3, J2.8, J2.13, J2.18, J3.3, J3.8, J3.13, J3.18, J4.2, D1.1]
  VBUS: [J3.19, J3.20]
  3V3: [J3.15, J3.16]
  RUN: [J3.10]
  SWCLK: [J4.1]
  SWD: [J4.3]
  LED: [U1.37, R7.1]
  LED_A: [R7.2, D1.2]
  # Header pins as on the Pico (pins 1-20 on J2, 21-40 on J3 counted
  # from the far end): GPIO, GND every fifth pin.
  GP0: [U1.2, J2.1]
  GP1: [U1.3, J2.2]
  GP2: [U1.4, J2.4]
  GP3: [U1.5, J2.5]
  GP4: [U1.6, J2.6]
  GP5: [U1.7, J2.7]
  GP6: [U1.8, J2.9]
  GP7: [U1.9, J2.10]
  GP8: [U1.11, J2.11]
  GP9: [U1.12, J2.12]
  GP10: [U1.13, J2.14]
  GP11: [U1.14, J2.15]
  GP12: [U1.15, J2.16]
  GP13: [U1.16, J2.17]
  GP14: [U1.17, J2.19]
  GP15: [U1.18, J2.20]
  GP16: [U1.27, J3.1]
  GP17: [U1.28, J3.2]
  GP18: [U1.29, J3.4]
  GP19: [U1.30, J3.5]
  GP20: [U1.31, J3.6]
  GP21: [U1.32, J3.7]
  GP22: [U1.34, J3.9]
  GP26: [U1.38, J3.11]
  GP27: [U1.39, J3.12]
  GP28: [U1.40, J3.14]

# Nets fed from outside the schematic's own power outputs.
power_flags: [GND, VBUS]

# Pins deliberately left open (get a no-connect flag); the circuits add
# their own (USB-C SBU1/SBU2).
no_connect: [U1.35, U1.36, U1.41, J3.17]
