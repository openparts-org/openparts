# Pico-style placement: USB right, U1 rot -90 (GP0-11 up to J2, GP18-28 down to J3);
# the crystal group sits 1.2 mm clear of U1 for the fan-out on its left side.
# Placement Model frame (docs/spec/placement-model.md): mm from the board
# centre, Y up; each part's origin is its land-pattern centroid and at rot 0
# it lies pin 1 upper left (USB-C: opening down; SOT/crystal per IPC-7351B
# Level A). A part lands at T * R(rot) * M: on the bottom side M mirrors
# x -> -x in the part's own frame, and rot is counter-clockwise viewed from
# the top on both sides.
# J1 sits where its drawing's "PCB Edge" line meets the board edge.
