# Four mounting holes, a pair at each end of the board, symmetric about
# its centre. Vars: d, dx, inset.
- params:
    mount_d: ["{{d}}", mounting hole diameter (datasheet)]
    mount_dx: ["{{dx}}", mounting hole spacing along X (datasheet)]
    mount_inset: ["{{inset}}", short board edge to the mounting hole centres (datasheet)]
- solid.cylinder:
    {diameter: mount_d, height: body_h + 0.2 mm, base: [-mount_dx / 2, body_l / 2 - mount_inset, -0.1 mm],
     operation: cut, targets: [Board], name: MountingHole}
- solid.pattern.rectangular:
    {features: [MountingHole], dir1: [1, 0, 0], count1: 2, spacing1: mount_dx,
     dir2: [0, -1, 0], count2: 2, spacing2: body_l - 2 * mount_inset, name: MountingHoles}
