# One DIP leg, seen along the row: out of the body side, bent down to the
# row line, resting on the board on its shoulders (z = 0), then the narrow
# pin into the hole. Vars: tag, plane, flip, first, neg.
- sketch.create: {plane: "{{plane}}", flip: "{{flip}}", offset: "{{first}}", name: "LegProfile{{tag}}"}
- sketch.line:
    closed: true
    ids: ["d{{tag}}0", "d{{tag}}1", "d{{tag}}2", "d{{tag}}3", "d{{tag}}4", "d{{tag}}5"]
    points:
      - ["{{neg}}(body_w / 2 - 0.3 mm)", parting + lead_t / 2]
      - ["{{neg}}(row_span / 2 + lead_t / 2)", parting + lead_t / 2]
      - ["{{neg}}(row_span / 2 + lead_t / 2)", 0 mm]
      - ["{{neg}}(row_span / 2 - lead_t / 2)", 0 mm]
      - ["{{neg}}(row_span / 2 - lead_t / 2)", parting - lead_t / 2]
      - ["{{neg}}(body_w / 2 - 0.3 mm)", parting - lead_t / 2]
- sketch.fillet: {a: "d{{tag}}0", b: "d{{tag}}1", radius: bend_r + lead_t}
- sketch.fillet: {a: "d{{tag}}3", b: "d{{tag}}4", radius: bend_r}
- sketch.finish: {}
- solid.extrude:
    {sketch: "LegProfile{{tag}}", distance: shoulder_w, direction: symmetric,
     operation: new, body_name: "Leg{{tag}}", name: "Leg{{tag}}"}
- sketch.create: {plane: "{{plane}}", flip: "{{flip}}", offset: "{{first}}", name: "PinProfile{{tag}}"}
- sketch.rectangle.two_point:
    {p0: ["{{neg}}(row_span / 2 - lead_t / 2)", -lead_below], p1: ["{{neg}}(row_span / 2 + lead_t / 2)", 0 mm]}
- sketch.finish: {}
- solid.extrude:
    {sketch: "PinProfile{{tag}}", distance: pin_w, direction: symmetric,
     operation: join, targets: ["Leg{{tag}}"], name: "Pin{{tag}}"}
