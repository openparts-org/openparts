# Rotary encoder: a housing, a threaded bushing on its top and the
# shaft standing in it, a D-flat cut into the shaft's upper half.
# Vars: shaft_d, rise (bushing + shaft above the housing), bushing_d,
# bushing_h.
- params:
    shaft_d: ["{{shaft_d}}", "shaft diameter (datasheet, else generator default)"]
    rise: ["{{rise}}", "bushing + shaft above the housing (overall height, else generator default)"]
    bushing_d: ["{{bushing_d}}", "bushing diameter (datasheet, else generator default: M7 for a 6 mm shaft)"]
    bushing_h: ["{{bushing_h}}", "bushing height (datasheet, else generator default)"]
    shaft_base: [standoff + body_h + bushing_h, shaft base]
    shaft_l: [rise - bushing_h, shaft length above the bushing]
    flat_t: [shaft_d * 0.3, "D-flat depth (generator default)"]
- solid.box:
    {length: body_w, width: body_l, height: body_h, center: [0 mm, 0 mm, standoff + body_h / 2],
     body_name: Housing, name: Housing}
- solid.cylinder:
    {diameter: bushing_d, height: bushing_h, axis: Z, base: [0 mm, 0 mm, standoff + body_h],
     operation: new, body_name: Bushing, name: Bushing}
- solid.cylinder:
    {diameter: shaft_d, height: shaft_l, axis: Z, base: [0 mm, 0 mm, shaft_base],
     operation: new, body_name: Shaft, name: Shaft}
- solid.box:
    {length: shaft_d + 0.2 mm, width: flat_t + 0.1 mm, height: shaft_l * 0.5 + 0.1 mm,
     center: [0 mm, shaft_d / 2 - flat_t / 2 + 0.05 mm, shaft_base + shaft_l * 0.75 + 0.05 mm],
     operation: new, body_name: Flat, name: Flat}
- solid.combine: {target: Shaft, tools: [Flat], operation: cut, keep_tools: false}
