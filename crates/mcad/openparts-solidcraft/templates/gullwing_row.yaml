# One gull-wing lead, seen from the side: out of the body at the parting
# line, bent down, foot flat on the board. Drawn on the vertical plane
# through the row's first lead and extruded to the lead width.
# Vars: tag (L/B/R/T), plane, flip, first (row position), neg ("-" on
# the left/bottom edges), half (body half size outward).
- sketch.create: {plane: "{{plane}}", flip: "{{flip}}", offset: "{{first}}", name: "LeadProfile{{tag}}"}
- sketch.line:
    closed: true
    ids: ["g{{tag}}0", "g{{tag}}1", "g{{tag}}2", "g{{tag}}3", "g{{tag}}4", "g{{tag}}5", "g{{tag}}6", "g{{tag}}7"]
    points:
      - ["{{neg}}({{half}} - lead_embed)", parting + lead_t / 2]
      - ["{{neg}}({{half}} + lead_exit)", parting + lead_t / 2]
      - ["{{neg}}({{half}} + lead_reach - lead_foot)", lead_t]
      - ["{{neg}}({{half}} + lead_reach)", lead_t]
      - ["{{neg}}({{half}} + lead_reach)", 0 mm]
      - ["{{neg}}({{half}} + lead_reach - lead_foot - lead_t * 0.5)", 0 mm]
      - ["{{neg}}({{half}} + lead_exit - lead_t * 0.5)", parting - lead_t / 2]
      - ["{{neg}}({{half}} - lead_embed)", parting - lead_t / 2]
# Upper bend (outer, inner) and lower bend (inner, outer).
- sketch.fillet: {a: "g{{tag}}0", b: "g{{tag}}1", radius: bend_r + lead_t}
- sketch.fillet: {a: "g{{tag}}5", b: "g{{tag}}6", radius: bend_r}
- sketch.fillet: {a: "g{{tag}}1", b: "g{{tag}}2", radius: bend_r}
- sketch.fillet: {a: "g{{tag}}4", b: "g{{tag}}5", radius: bend_r + lead_t}
- sketch.finish: {}
- solid.extrude:
    {sketch: "LeadProfile{{tag}}", distance: lead_w, direction: symmetric,
     operation: new, body_name: "Lead{{tag}}", name: "Lead{{tag}}"}
