# The formed TO-92 middle leg: straight down from the body, then a jog to
# its staggered hole at y. Vars: name, x, y.
- sketch.create: {plane: YZ, offset: "{{x}}", name: "{{name}}Profile"}
- sketch.line:
    closed: true
    ids: [m0, m1, m2, m3, m4, m5, m6, m7]
    points:
      - [pin_t / 2, seat_h]
      - [pin_t / 2, 1.3 mm]
      - ["{{y}} + pin_t / 2", 0.6 mm]
      - ["{{y}} + pin_t / 2", -lead_below]
      - ["{{y}} - pin_t / 2", -lead_below]
      - ["{{y}} - pin_t / 2", 0.6 mm]
      - [-pin_t / 2, 1.3 mm]
      - [-pin_t / 2, seat_h]
- sketch.finish: {}
- solid.extrude:
    {sketch: "{{name}}Profile", distance: pin_w, direction: symmetric,
     operation: new, body_name: "{{name}}", name: "{{name}}"}
