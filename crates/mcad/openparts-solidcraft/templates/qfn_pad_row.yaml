# One QFN/LGA terminal at the row's first lead, pad_inset in from the
# body edge (flush on QFN/DFN).
# Vars: tag, plane, flip, first, neg, half (as gullwing_row).
- sketch.create: {plane: "{{plane}}", flip: "{{flip}}", offset: "{{first}}", name: "PadProfile{{tag}}"}
- sketch.rectangle.two_point: {p0: ["{{neg}}({{half}} - pad_inset - pad_len)", 0 mm], p1: ["{{neg}}({{half}} - pad_inset)", term_t]}
- sketch.finish: {}
- solid.extrude:
    {sketch: "PadProfile{{tag}}", distance: pad_w, direction: symmetric,
     operation: new, body_name: "Pad{{tag}}", name: "Pad{{tag}}"}
