# Tactile switch: the housing with a round actuator on top.
# Vars: standoff, act_d, act_top.
- include: tact_housing
- params:
    act_d: ["{{act_d}}", actuator diameter]
    act_top: ["{{act_top}}", actuator top above the board]
- solid.cylinder:
    {diameter: act_d, height: act_top - standoff - body_h + 0.1 mm, base: [0 mm, 0 mm, standoff + body_h - 0.1 mm],
     operation: new, body_name: Actuator, name: Actuator}
