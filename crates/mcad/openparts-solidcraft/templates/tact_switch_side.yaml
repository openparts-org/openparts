# Side-operated tactile switch: the housing with a round actuator leaving
# its +Y face. Vars: standoff, act_d, act_len, act_z.
- include: tact_housing
- params:
    act_d: ["{{act_d}}", actuator diameter]
    act_len: ["{{act_len}}", actuator length beyond the housing face]
    act_z: ["{{act_z}}", "actuator axis above the board (datasheet, else the housing's middle)"]
- solid.cylinder:
    {diameter: act_d, height: act_len + 0.1 mm, axis: Y, base: [0 mm, body_l / 2 - 0.1 mm, act_z],
     operation: new, body_name: Actuator, name: Actuator}
