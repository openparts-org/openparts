[package]
name = "openparts-viewer"
version.workspace = true
edition.workspace = true
publish = false
description = "The web site's 3D model and footprint viewer with datasheet dimensions and a measure tool (wgpu, compiled to WebAssembly)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openparts-core = { path = "../../openparts-core" }
openparts-mcad = { path = "../../mcad/openparts-mcad" }
openparts-pcbcad = { path = "../../pcbcad/openparts-pcbcad" }
serde = { workspace = true }
glam = "0.34"
roxmltree = "0.21"
zip = { version = "9", default-features = false, features = ["deflate"] }

# The browser side (renderer, DOM overlay, events) only exists on wasm32;
# the geometry, parsing and dimension code above is tested natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = "1"
wgpu = { version = "30", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
bytemuck = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Node",
  "CssStyleDeclaration", "DomRect", "Event", "EventTarget", "MouseEvent",
  "PointerEvent", "WheelEvent", "KeyboardEvent", "Response", "Request",
  "RequestInit", "Headers", "AddEventListenerOptions", "ResizeObserver",
  "ResizeObserverEntry", "SvgElement", "SvgGraphicsElement", "SvgMatrix",
  "SvgPoint", "SvgsvgElement", "DomPoint", "DomPointReadOnly", "DomMatrix", "DomMatrixReadOnly",
  "console", "DomTokenList",
] }

[dev-dependencies]
serde_json = "1"
