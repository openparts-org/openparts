[package]
name = "openparts-bom"
version.workspace = true
edition.workspace = true
description = "BOM parsing and matching, and alternative-part suggestions with pin-compatibility analysis, over an OpenParts dataset."

[dependencies]
openparts-core = { path = "../openparts-core" }
openparts-data = { path = "../openparts-data" }
openparts-mcad = { path = "../mcad/openparts-mcad" }
openparts-pcbcad = { path = "../pcbcad/openparts-pcbcad" }
serde = { workspace = true }
thiserror = { workspace = true }
schemars = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
# JSON Schemas of the report types (openparts-web's MoonBit API types).
schema = ["dep:schemars", "openparts-core/schema"]
