# Code CI (Testing and Quality Specification section 12) for the whole
# repository: the Rust workspace (crates, server, KiCad plugin) against
# the real openparts-data fixtures, and the web site.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out openparts-data (fixtures, next to this repository)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openparts-data
          path: openparts-data-checkout

      - name: Use the sibling layout the tests expect
        run: |
          rm -rf ../openparts-data
          mv openparts-data-checkout ../openparts-data

      # The KiCad plugin's GUI (eframe) links against GTK3/X11/Wayland;
      # no display is needed to build or test.
      - name: Install eframe Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The part viewer's browser side only compiles for wasm32.
      - name: cargo clippy (viewer, wasm32)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy -p openparts-viewer --target wasm32-unknown-unknown -- -D warnings

      # SolidCraft isn't available here: tests that need it say so and
      # skip (set OPENPARTS_REQUIRE_SOLIDCRAFT where it is installed).
      - name: cargo test
        run: cargo test --workspace

      - name: The whole dataset validates
        run: cargo run -q -p openparts-cli -- validate --data ../openparts-data

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: The web site's API types are up to date
        run: |
          (cd web && moon update && moon check --target js)  # fetches the MoonBit dependencies
          web/scripts/gen-api-types.sh
          git diff --exit-code -- web/api

  # The board tool's pure-Python routing rules (tools/kicad-board/rules.py:
  # fab profiles, IPC-2221 widths, microstrip, escape widths, .kicad_dru,
  # fan-out). The pcbnew half needs KiCad and is not run here.
  kicad-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml ruff
      - run: ruff check --select F,E9 tools
      - run: pytest -q tools/kicad-board/tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The part viewer (crates/viewer/openparts-viewer) is Rust compiled
      # to wasm: bun run build runs scripts/build-wasm.sh, which needs the
      # wasm32 target and wasm-bindgen-cli at the Cargo.lock version.
      - name: Install Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install wasm-bindgen-cli (the Cargo.lock version)
        run: cargo binstall -y --force "wasm-bindgen-cli@$(scripts/build-wasm.sh --bindgen-version)"
      # Fetches the MoonBit dependencies into .mooncakes/.
      - run: moon update && moon check --target js
      - run: bun install --frozen-lockfile
      - run: moon check --target js --deny-warn
      - run: moon test --target js
      - run: bun run build
