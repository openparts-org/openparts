# The web site (web/) on GitHub Pages.
name: web-deploy

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build
        env:
          # Points the deployed site at a live openparts-server. Empty
          # until one is actually deployed -- until then, every API call
          # (search, part detail, 3D preview, downloads) fails with a
          # handled error message rather than breaking the page; the
          # static content (landing, KiCad plugin, contributing pages)
          # still works. Set the OPENPARTS_API_BASE repository variable
          # once a server is live, e.g. https://api.openparts.example.
          PUBLIC_OPENPARTS_API_BASE: ${{ vars.OPENPARTS_API_BASE || '/api' }}
        run: bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
