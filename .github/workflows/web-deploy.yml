# The web site (web/) on GitHub Pages.
name: web-deploy

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Fetches the MoonBit dependencies into .mooncakes/ (bun install
      # links the three.js bindings' JS from there).
      - run: moon update && moon check --target js

      - run: bun install --frozen-lockfile

      - name: Build
        env:
          # Points the deployed site at a live openparts-server. Empty
          # until one is actually deployed -- until then, every API call
          # (search, part detail, 3D preview, downloads) fails with a
          # handled error message rather than breaking the page; the
          # static content (landing, KiCad plugin, contributing pages)
          # still works. Set the OPENPARTS_API_BASE repository variable
          # once a server is live, e.g. https://api.openparts.example.
          VITE_OPENPARTS_API_BASE: ${{ vars.OPENPARTS_API_BASE || '/api' }}
          # The project site's path.
          OPENPARTS_BASE: /openparts/
        run: |
          bun run build
          # Deep links (/openparts/parts?...) land on 404.html: the same app.
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
