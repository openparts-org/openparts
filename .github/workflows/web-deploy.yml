# GitHub Pages (openparts-org.github.io/openparts/) only redirects to the
# live site, which openparts-server serves together with its API
# (deploy/raspberry-pi/). Old links keep their path and query:
# /openparts/parts?q=rp2040 -> https://openparts.jijinbei.jp/parts?q=rp2040
name: web-deploy

on:
  push:
    branches: [main]
    paths: [".github/workflows/web-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE: https://openparts.jijinbei.jp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Redirect pages
        run: |
          mkdir -p site
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>OpenParts has moved</title>
              <link rel="canonical" href="$SITE/" />
              <meta name="robots" content="noindex" />
              <meta http-equiv="refresh" content="0; url=$SITE/" />
              <script>
                // Keep the path below /openparts/ and the query.
                var p = location.pathname.replace(/^\/openparts\/?/, "/");
                location.replace("$SITE" + p + location.search + location.hash);
              </script>
            </head>
            <body>
              <p>OpenParts has moved to <a href="$SITE/">$SITE</a>.</p>
            </body>
          </html>
          EOF
          cp site/index.html site/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
